services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable GHCR image digest}
    env_file:
      - ./.env.production
    environment:
      DATABASE_URL: sqlite:////data/talent-lab.sqlite3
      UPLOAD_DIR: /uploads
    volumes:
      - talent-lab-data:/data
      - talent-lab-uploads:/uploads
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from urllib.request import urlopen;
          urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 45s
    restart: unless-stopped

volumes:
  talent-lab-data:
  talent-lab-uploads:
