services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ./.env.production
    environment:
      DATABASE_URL: sqlite:////data/talent-lab.sqlite3
      UPLOAD_DIR: /uploads
    volumes:
      - talent-lab-data:/data
      - talent-lab-uploads:/uploads
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

volumes:
  talent-lab-data:
  talent-lab-uploads:

